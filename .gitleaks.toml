title = "secure-ax-k3s gitleaks config"

[extend]
useDefault = true

# DuckDNS token (UUID), keyword-anchored: flagged only when duckdns/token/api key/
# secret appears earlier on the same line (up to 80 chars). Bare UUIDs are not flagged.
[[rules]]
id = "duckdns-token"
description = "DuckDNS token (UUID near a duckdns/token/apikey keyword)"
regex = '''(?i)(?:duckdns|token|api[_-]?key|secret)[^\n]{0,80}?\b([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
keywords = ["duckdns", "token", "apikey", "api_key", "api-key", "secret"]

# DuckDNS token in a YAML block: a "duckdns" line followed within 4 lines by a
# UUID value (e.g. "duckdns:\n  key: <uuid>").
[[rules]]
id = "duckdns-token-block"
description = "UUID within a few lines after a duckdns key"
regex = '''(?i)duckdns[^\n]*(?:\n[^\n]*){0,4}?\n[ \t-]*[A-Za-z_-]+[ \t]*[:=][ \t]*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
keywords = ["duckdns"]

# DuckDNS token stored in a file named like duckdns-token / token.txt / ~/.duckdns:
# any UUID inside a file whose path contains duckdns or token is flagged.
[[rules]]
id = "duckdns-token-file"
description = "UUID in a file whose path mentions duckdns or token"
path = '''(?i)(duckdns|token)'''
regex = '''(?i)\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''

# Tailscale keys: tskey-auth-/client-/api-, legacy tskey-<hex> and tskey-k<id>-<secret>.
# Obvious documentation placeholders (tskey-auth-XXXX...) are allowlisted.
[[rules]]
id = "tailscale-auth-key"
description = "Tailscale auth/API/client key"
regex = '''\btskey-[A-Za-z0-9-]{16,}'''
keywords = ["tskey-"]
[[rules.allowlists]]
description = "documentation placeholders"
regexes = ['''(?i)^tskey-(?:[a-z]+-)?(?:x+|\*+|0+)[x*0-]*$''']

# Cloudflare API token assigned without the word "cloudflare" nearby (gitleaks'
# default cloudflare-* rules need that keyword): CF_API_TOKEN=<40+ chars> in env
# files, or "api-token: <40+ chars>" in a Kubernetes Secret. Placeholders such
# as <placeholder> or ${VAR} do not match (not in the token charset).
[[rules]]
id = "cloudflare-api-token-env"
description = "Cloudflare API token in CF_API_TOKEN= or api-token: form"
regex = '''(?i)\b(?:cf[_-]api[_-]token|api-token)["']?[ \t]*[:=][ \t]*["']?([A-Za-z0-9_-]{40,})\b'''
secretGroup = 1
keywords = ["cf_api_token", "cf-api-token", "api-token"]

# cloudflared tunnel credentials JSON: the "TunnelSecret" value (base64).
[[rules]]
id = "cloudflared-tunnel-credentials"
description = "cloudflared tunnel credentials file (TunnelSecret)"
regex = '''"TunnelSecret"[ \t]*:[ \t]*"([A-Za-z0-9+/_-]{20,}={0,2})"'''
secretGroup = 1
keywords = ["tunnelsecret"]

# Remotely-managed tunnel token: base64 of {"a":"<account>",... ; always starts eyJhIjoi.
[[rules]]
id = "cloudflared-tunnel-token"
description = "cloudflared remotely-managed tunnel token"
regex = '''\beyJhIjoi[A-Za-z0-9+/_-]{20,}={0,2}'''
keywords = ["eyjhijoi"]

# cloudflared origin certificate (cert.pem) from `cloudflared tunnel login`.
[[rules]]
id = "cloudflared-origin-cert"
description = "cloudflared origin certificate (ARGO TUNNEL TOKEN PEM block)"
regex = '''-----BEGIN ARGO TUNNEL TOKEN-----[A-Za-z0-9+/=\s-]{20,}?-----END ARGO TUNNEL TOKEN-----'''
keywords = ["begin argo tunnel token"]
